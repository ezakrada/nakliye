name: Release Pipeline

# Tag push'larında çalışır: v1.2.3, v2.0.0-beta vs.
# Akıllı: repo yapısını OTOMATİK tanır.
#   - Kök dizindeki .php obfuscate eder (tur, stats için)
#   - app/ src/ panel/ website/ frontend/ docker-package/app/ — hepsini tarar
#   - Next.js bundle'ı obfuscate eder
#   - integrity-manifest.json üretir (her dosyanın SHA-256'sı)
#   - ZIP paketler + GitHub Release oluşturur

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, openssl, curl, zip, gd
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (composer + npm)
        run: |
          if [ -f composer.json ]; then composer install --no-dev --optimize-autoloader; fi
          if [ -f package.json ]; then npm ci --omit=dev || npm install --omit=dev; fi

      - name: Build Next.js (varsa)
        run: |
          if [ -f next.config.js ] || [ -f next.config.mjs ]; then npm run build; fi

      # ─── PHP Obfuscation (akıllı) ───
      - name: Install YAK Pro Obfuscator
        run: |
          git clone --depth 1 https://github.com/pk-fr/yakpro-po.git /tmp/yakpro
          cd /tmp/yakpro && composer install --no-dev

      - name: Obfuscate PHP — auto-detect structure
        run: |
          set -e
          # Akıllı detection: bu repo yapılarının HER BİRİNİ tarar
          PHP_DIRS=()
          for d in app src panel website frontend docker-package/app api includes core lib; do
            [ -d "$d" ] && PHP_DIRS+=("$d")
          done

          if [ ${#PHP_DIRS[@]} -gt 0 ]; then
            echo "Obfuscating directories: ${PHP_DIRS[*]}"
            for dir in "${PHP_DIRS[@]}"; do
              php /tmp/yakpro/yakpro-po.php --srcdir="$dir" --destdir="${dir}__obf" || { echo "obfuscate failed for $dir"; continue; }
              rm -rf "$dir"
              mv "${dir}__obf" "$dir"
            done
          fi

          # Kök dizinde direkt .php dosyaları varsa (tur/stats gibi) — onları da obfuscate et
          ROOT_PHP_COUNT=$(find . -maxdepth 1 -name "*.php" -type f | wc -l)
          if [ "$ROOT_PHP_COUNT" -gt 0 ]; then
            echo "Obfuscating $ROOT_PHP_COUNT root PHP files"
            mkdir -p /tmp/rootphp
            cp *.php /tmp/rootphp/
            php /tmp/yakpro/yakpro-po.php --srcdir=/tmp/rootphp --destdir=/tmp/rootphp_obf || true
            if [ -d /tmp/rootphp_obf ]; then
              cp -f /tmp/rootphp_obf/*.php ./
            fi
          fi

      # ─── JS Obfuscation ───
      - name: Obfuscate JS bundles
        run: |
          if [ -d .next/static/chunks ]; then
            npm install -g javascript-obfuscator
            find .next/static/chunks -name "*.js" -type f | while read f; do
              javascript-obfuscator "$f" --output "$f.obf" --compact true --string-array true --string-array-encoding base64 --rename-globals false
              mv "$f.obf" "$f"
            done
          fi

      # ─── Integrity Manifest ───
      - name: Generate integrity-manifest.json
        run: |
          cat > /tmp/manifest.php <<'PHP'
          <?php
          $root = '.';
          $exts = ['php','js','css','html','json','sql'];
          $skip = ['.git','.github','node_modules','vendor/.git','tests'];
          $files = [];
          $rii = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
          foreach ($rii as $f) {
              if (!$f->isFile()) continue;
              $rel = ltrim(str_replace($root, '', $f->getPathname()), '/');
              foreach ($skip as $s) { if (strpos($rel, $s) === 0) continue 2; }
              if (!in_array(strtolower($f->getExtension()), $exts)) continue;
              $files[$rel] = 'sha256:' . hash_file('sha256', $f->getPathname());
          }
          echo json_encode([
              'version' => getenv('VERSION') ?: '0.0.0',
              'generated_at' => date('c'),
              'files' => $files,
              'count' => count($files),
          ], JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES);
          PHP
          VERSION="${GITHUB_REF#refs/tags/v}" php /tmp/manifest.php > integrity-manifest.json
          echo "Manifest generated: $(wc -l < integrity-manifest.json) lines"

      # ─── cPanel/DirectAdmin için web installer'ı dahil et ───
      - name: Embed cPanel web installer
        run: |
          # update.ezar.tr'dan en son web-install.php'yi indir (sürüme eşlenir)
          curl -sfL https://update.ezar.tr/web-install.php -o install.php || \
            echo '<?php die("Web installer indirilemedi — manuel kurulum gerek."); ?>' > install.php

          # database.sql varsa kök dizine kopyala
          for d in db database; do
            if [ -f "$d"/*.sql ]; then cp "$d"/*.sql ./database.sql 2>/dev/null && break; fi
            if [ -f "$d"/*.sql.gz ]; then gunzip -c "$d"/*.sql.gz > ./database.sql && break; fi
          done

          # .htaccess — kurulum yapılmadıysa OTOMATİK install.php'ye yönlendir
          # (cPanel/DirectAdmin/Plesk Apache kullanır → bu çalışır)
          if [ ! -f .htaccess ]; then
            cat > .htaccess <<'HTACCESS'
          # Auto-redirect to web installer if not yet installed
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteCond %{DOCUMENT_ROOT}/.installed !-f
          RewriteRule ^$ /install.php [L,R=302]
          HTACCESS
          fi

      # ─── ZIP paketle ───
      - name: Create ZIP
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ZIP_NAME="${GITHUB_REPOSITORY#*/}-v${VERSION}.zip"
          zip -rq "$ZIP_NAME" . \
            -x ".git/*" ".github/*" "node_modules/*" "tests/*" \
               "*.test.php" "*.test.js" ".env" ".env.local" \
               ".gitignore" ".gitattributes" \
               "phpunit.xml*" "package-lock.json" "composer.lock"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          ls -la "$ZIP_NAME"
          echo "SHA256=$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)" >> $GITHUB_ENV

      # ─── SHA-256 hash dosyası ───
      - name: Generate ZIP hash file
        run: |
          sha256sum "${{ env.ZIP_NAME }}" > "${{ env.ZIP_NAME }}.sha256"

      # ─── GitHub Release ───
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "v${{ env.VERSION }}"
          body: |
            **Otomatik release — Ezar.TR Lisans Pipeline**

            - 🔒 PHP kaynak kodu obfuscate edildi (YAK Pro)
            - 🔒 JS bundle'ları obfuscate edildi
            - 📋 integrity-manifest.json üretildi (her dosyanın SHA-256'sı)
            - 📦 ZIP: `${{ env.ZIP_NAME }}`
            - 🔐 SHA-256: `${{ env.SHA256 }}`

            **Müşteri kurulumlarına otomatik dağıtım için** license.ezar.tr webhook'u tetiklendi.
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            integrity-manifest.json
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
